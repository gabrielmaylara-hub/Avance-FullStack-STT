services:
  - type: web
    name: stt-final-07229881
    runtime: node
    plan: free
    region: oregon
    branch: entrega-final
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "24.22.3"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stt-final-db-07229881
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: TECH_PASSWORD
        sync: false

databases:
  - name: stt-final-db-07229881
    plan: free
    region: oregon
    databaseName: stt
    user: stt
    ipAllowList: []
